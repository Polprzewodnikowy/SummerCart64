name: Create a test build

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - '!stable'
      - '!develop'

jobs:
  package_linux:
    name: Linux
    uses: ./.github/workflows/job_build.yml
    with:
      platform: linux
      target: debug
      zip: false
    secrets: inherit

  package_win:
    name: Windows
    uses: ./.github/workflows/job_build.yml
    with:
      platform: win
      target: debug
      zip: false
    secrets: inherit

